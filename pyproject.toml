[project]
name = "rowbot"
version = "0.1.0"
description = "A Textual TUI chat frontend with FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.40",
    "httpx>=0.25",
    "rich>=13.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "sse-starlette>=1.6",
    "pydantic-ai[ollama]>=0.0.49",
    "logfire[system-metrics]>=4.39.0",
    "pydantic-ai-harness>=0.65.0",
    "catppuccin[rich]>=2.5.0",
]

[project.scripts]
rowbot = "main:main"
rowbot-server = "backend.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontend", "backend", "shared"]
force-include = { "main.py" = "main.py" }
